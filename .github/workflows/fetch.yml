name: Fetch Capstone

on:
  schedule:
    # 3x por dia: 8h, 13h, 18h BRT (BRT = UTC-3, então 11h, 16h, 21h UTC)
    - cron: '0 11,16,21 * * *'
  workflow_dispatch:  # permite rodar manualmente pelo botão "Run workflow" no GitHub

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - run: python fetch_capstone.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/capstone.json
          git diff --staged --quiet || git commit -m "update capstone $(date -u +%Y-%m-%d_%H:%MUTC)"
          git push
